# knocker.example.yaml

server:
  trusted_proxies:
    # ONLY the reverse proxy's own addresses belong in this list -- never a whole subnet.
    #
    # Knocker only honors X-Forwarded-For when the direct TCP peer is listed here,
    # so every peer inside a trusted range becomes an identity authority: any other
    # container on that network (a compromised backend, or an SSRF bug inside one)
    # could claim any client IP via `X-Forwarded-For`, knock under someone else's
    # address, or whitelist arbitrary IPs with a regular key that lacks
    # `allow_remote_whitelist`.
    #
    # Docker does not hand out stable container IPs by default, so pin the proxy to
    # fixed addresses (`ipv4_address` / `ipv6_address` under `caddy_net`, see the
    # commented-out caddy service in docker-compose.yml) and list exactly those.
    - "172.16.238.2/32"       # Caddy's static IPv4 on caddy_net
    - "fd00:dead:beef::2/128" # Caddy's static IPv6 on caddy_net

cors:
  allowed_origin: "https://knocker.fariszr.com"  # SECURITY: Set to your Knocker web webapp's origin if you are hosting your own.

security:
  always_allowed_ips:
    # These addresses are authorized by /verify permanently -- no knock required.
    #
    # Keep this to the reverse proxy's own address(es) plus loopback if something
    # on the same host queries knocker directly. NEVER put a whole subnet here:
    # every container inside that range would then pass /verify unconditionally,
    # with no whitelist entry and no knock at all.
    #
    # Entries are matched against Knocker's *resolved* client IP, so traffic that
    # arrives through a correctly configured trusted proxy is still checked by its
    # real (forwarded) address. If you remove an address from trusted_proxies,
    # remove it from here too -- otherwise all traffic from that peer would be
    # accepted under its own address instead of being verified per client.
    - "172.16.238.2/32"       # The reverse proxy (Caddy)
    - "fd00:dead:beef::2/128"
    - "127.0.0.1"             # Loopback (optional; drop if unused)
    - "::1"
    # Request paths that start with any of these values will bypass
    # the IP whitelist check entirely.
    # Prefer host-scoped exclusions below; a global exclusion affects every host.
  excluded_paths: []
  excluded_paths_by_host: {}
    # Optional host-specific exclusions. These are only trusted when the
    # request comes through a trusted proxy that forwards host/path metadata.
    # "jellyfin.your-domain.com":
    #   - "/health"
  # Maximum number of entries in the whitelist (default: 10000)
  max_whitelist_entries: 10000
  knock_rate_limit:
    # Sliding-window limits per resolved client IP.
    window_seconds: 60
    successful_requests: 20
    failed_requests: 30

whitelist:
  # The path where the whitelist file will be stored.
  # Use a .json file under /data, /tmp, or the process working directory.
  # Set KNOCKER_CONFIG_PATH to your real knocker.yaml; this example file is the schema reference.
  # The docker-compose.yml file will mount a volume to this location.
  storage_path: "/data/whitelist.json"
  cleanup_interval_seconds: 60

# Firewalld integration for advanced network-level firewall control
# This creates dynamic firewall rules that automatically expire based on TTL
firewalld:
  enabled: false  # Set to true to enable firewalld integration (requires container to run as root and have access to system dbus socket)
  zone_name: "knocker"  # Name of the firewalld zone to create
                        # WARNING: Zone won't be cleaned up automatically on shutdown
  zone_priority: -100  # Zone priority (negative numbers = higher priority)
                       # Default -100 ensures knocker rules take precedence
  # zone_target: "default"  # Optional: Set the zone target (default: not set)
                            # Options: "default", "ACCEPT", "REJECT", "DROP"
                            # "default" = practically matches reject behavior
                            # "ACCEPT" = Accept all packets not matched by rules set by knocker
                            # "REJECT" = Reject all packets not matched by rules set by knocker
                            # "DROP" = Silently drop all packets not matched by rules set by knocker
                            # Note: When not specified, the zone target is not set, and the default target will be used.
                            # Firewalld docs: https://firewalld.org/documentation/zone/options.html
  default_action: "drop"  # Action for blocked traffic on monitored ports:
                          # "drop" = silently discard (attackers don't know service exists)
                          # "reject" = refuse connection (faster for legitimate clients)
  monitored_ports:
    # Only these ports will be protected by knocker firewall rules
    # Unmonitored ports remain unaffected by knocker
    # Only whitelisted IPs can access these specific ports
    - port: 80
      protocol: tcp
    - port: 443
      protocol: tcp
    - port: 22
      protocol: tcp
  monitored_ips:
    # IP ranges that the firewalld zone will apply to
    # MUST include network mask (e.g., /32 for single IPv4 host, /128 for single IPv6 host)
    # 
    # WARNING: Using 0.0.0.0/0 or ::/0 applies DROP/REJECT rules to ALL traffic
    # at high priority. This will block ALL access to monitored ports by default.
    # Start with narrow ranges (your WAN subnet) and expand carefully.
    #
    # Examples:
    # - "192.168.1.100/32"    # Single IPv4 host
    # - "192.168.1.0/24"      # IPv4 subnet
    # - "2001:db8::1/128"     # Single IPv6 host
    # - "2001:db8::/32"       # IPv6 prefix
    # - "203.0.113.0/24"      # Your WAN IPv4 range
    # - "2001:db8:1234::/48"  # Your WAN IPv6 range
    # - "0.0.0.0/0"           # All IPv4 (USE WITH EXTREME CAUTION)
    # - "::/0"                # All IPv6 (USE WITH EXTREME CAUTION)
    - "203.0.113.0/24"        # Example WAN IPv4 range - CHANGE THIS
    - "2001:db8:1234::/48"    # Example WAN IPv6 range - CHANGE THIS
  
  # CONTAINER REQUIREMENTS:
  # - Must run as root (user: "0:0")
  # - Needs NET_ADMIN capability
  # - Requires system dbus mount: /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
  # - Host must have firewalld installed and running
  #
  # See docs/FIREWALLD_INTEGRATION.md for complete setup instructions

  # Add at least one entry with a newly generated secret before starting.
  # Example generation: `openssl rand -hex 32`
api_keys: []

# Documentation and OpenAPI configuration, disabled by default
documentation:
  enabled: false  # Documentation is disabled by default; set to true to expose docs endpoints
  openapi_output_path: "openapi.json"  # Path where OpenAPI schema will be saved when documentation is enabled
