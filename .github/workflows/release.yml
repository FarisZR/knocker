name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find release notes
        id: notes
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_path" ]; then
            printf 'path=%s\n' "$notes_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Release ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          body: |
            # Knocker ${{ github.ref_name }}
            
            ## Docker Images
            
            Pull the release image with:
            ```bash
            docker pull ghcr.io/fariszr/knocker:${{ github.ref_name }}
            # Or use the latest tag for the most recent stable release
            docker pull ghcr.io/fariszr/knocker:latest
            ```
            
            Supported architectures: `linux/amd64`, `linux/arm64`, `linux/arm/v7`
            
            ## Installation
            
            1. Download `knocker.example.yaml` and rename it to `knocker.yaml`
            2. Add at least one newly generated API key to `knocker.yaml`
            3. Set `server.trusted_proxies` to the reverse proxy's exact IP addresses
            4. Run with: `docker compose up -d`
            
            For detailed setup instructions, see the [README](https://github.com/FarisZR/knocker#readme).
            
            ## Security Notes
            
            - Generate unique high-entropy API keys; published placeholder values are rejected
            - Configure `trusted_proxies` to prevent IP spoofing
            - Review the [Security Guide](https://github.com/FarisZR/knocker/blob/main/docs/SECURITY.md)
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
