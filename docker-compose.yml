services:
  # caddy:
  #   image: caddy:latest
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp" # For HTTP/3
  #   networks:
  #     caddy_net:
  #       # Pin Caddy to fixed addresses so knocker.yaml can trust exactly one
  #       # peer instead of a whole subnet. Mirror these exact addresses into
  #       # `server.trusted_proxies` (and, if desired, `security.always_allowed_ips`)
  #       # in your knocker.yaml.
  #       ipv4_address: 172.16.238.2
  #       ipv6_address: fd00:dead:beef::2
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - ./knocker.yaml:/app/knocker.yaml
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - knocker

  knocker:
    # Use 'latest' for stable releases or 'main' for development builds
    image: oci.fariszr.com/fariszr/knocker:latest
    restart: unless-stopped
    networks:
      - caddy_net
    environment:
      - KNOCKER_CONFIG_PATH=/app/knocker.yaml
    volumes:
      - ./knocker.yaml:/app/knocker.yaml:ro
      - ./knocker_data:/data
      # REQUIRED OPTIONS for firewalld integration
      # - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    # user: "0:0"  # Run as root
    # userns_mode: host
    # cap_add:
    #   - NET_ADMIN

networks:
  caddy_net:
    # Enable IPv6 for this network
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        # Define subnets for both IPv4 and IPv6.
        # Do NOT put these subnets in knocker.yaml's trusted_proxies -- that would
        # make every container on the network an identity authority. Pin the proxy
        # with ipv4_address/ipv6_address (see the caddy service above) and list
        # only that address (/32, /128) in knocker.yaml.
        - subnet: 172.16.238.0/24
        - subnet: fd00:dead:beef::/64

volumes:
  caddy_data:
  caddy_config:
