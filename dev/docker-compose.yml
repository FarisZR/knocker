services:
  caddy:
    image: caddy:2.7.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
      - "127.0.0.1:18443:443/udp" # For HTTP/3
    networks:
      - caddy_net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--watch"]
    depends_on:
      - knocker

  knocker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${KNOCKER_TEST_IMAGE:-${COMPOSE_PROJECT_NAME:-knocker-dev}-knocker}
    restart: unless-stopped
    networks:
      - caddy_net
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - KNOCKER_CONFIG_PATH=/app/knocker.yaml
    volumes:
      - ${KNOCKER_HOST_TEST_CONFIG:-./knocker.firewalld.yaml}:/app/knocker.yaml:ro
      - knocker_data:/data
      # Mount system dbus for firewalld integration
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    # NOTE: Container runs as root when firewalld integration is enabled
    # This is required for dbus system access. Ensure firewalld.enabled is set
    # appropriately in your knocker.yaml configuration.
    user: "0:0"  # Run as root for firewalld/dbus access
    # FirewallD on the host owns NET_ADMIN; this client only talks to D-Bus.
    # The command is in the Dockerfile, but we could override it here if needed.
    # The application will look for 'knocker.yaml' in its root directory.

networks:
  caddy_net:
    # Enable IPv6 for this network
    enable_ipv6: true
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  knocker_data:
