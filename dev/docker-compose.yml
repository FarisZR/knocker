# Real FirewallD and D-Bus live inside knocker's disposable network namespace.
# No host ports, host network, host D-Bus socket, or privileged container.
services:
  knocker:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets:
        - proxy_ca
    image: ${COMPOSE_PROJECT_NAME}-knocker
    user: "0:0"
    init: true
    environment:
      PYTHONPATH: /app
    cap_add:
      - NET_ADMIN
    networks: &client_networks
      test_net:
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.disable_ipv6=0
    sysctls: &ipv6_sysctls
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
    volumes:
      - ./knocker.firewalld.yaml:/app/knocker.yaml:ro
      - ./firewalld:/test:ro
      - knocker_data:/data
    tmpfs:
      - /run
      - /tmp
    command: ["bash", "/test/start.sh"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 2s
      timeout: ${KNOCKER_TEST_HEALTH_TIMEOUT:-15s}
      start_period: 30s
      retries: 30

  client:
    image: ${COMPOSE_PROJECT_NAME}-knocker
    cap_drop: [ALL]
    networks: *client_networks
    sysctls: *ipv6_sysctls
    volumes:
      - ./firewalld:/test:ro
    command: ["python", "-c", "import time; time.sleep(86400)"]
    healthcheck: &client_health
      test: ["CMD", "grep", "-q", "eth0", "/proc/net/if_inet6"]
      interval: 2s
      timeout: 5s
      retries: 30

  stranger:
    image: ${COMPOSE_PROJECT_NAME}-knocker
    cap_drop: [ALL]
    networks: *client_networks
    sysctls: *ipv6_sysctls
    volumes:
      - ./firewalld:/test:ro
    command: ["python", "-c", "import time; time.sleep(86400)"]
    healthcheck: *client_health

networks:
  test_net:
    internal: true
    # Docker allocates IPv4 per project. IPv6 uses container-local link addresses,
    # avoiding any dependency on the daemon host's IPv6 NAT/firewall backend.

volumes:
  knocker_data:

secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}
