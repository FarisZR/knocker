# Reverse-proxy tests run entirely on their own Docker network too.
services:
  caddy:
    image: caddy:2.7.6
    networks: [test_net]
    environment:
      NO_PROXY: "${NO_PROXY:-},knocker,caddy,localhost,127.0.0.1,::1"
      no_proxy: "${NO_PROXY:-},knocker,caddy,localhost,127.0.0.1,::1"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      knocker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--quiet", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  knocker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${KNOCKER_TEST_IMAGE:-${COMPOSE_PROJECT_NAME}-knocker}
    networks: [test_net]
    volumes:
      - ./knocker.ci.yaml:/app/knocker.yaml:ro
      - knocker_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    image: ${KNOCKER_TEST_IMAGE:-${COMPOSE_PROJECT_NAME}-knocker}
    cap_drop: [ALL]
    networks: [test_net]
    volumes:
      - ./caddy_tests.sh:/test/caddy_tests.sh:ro
    environment:
      BASE_URL: http://caddy
    command: ["bash", "/test/caddy_tests.sh"]
    profiles: [tests]

networks:
  test_net:
    internal: true

volumes:
  knocker_data:
